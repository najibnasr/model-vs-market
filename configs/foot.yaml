# Configuration du module foot. Toute la chaîne de données est reconstruite à partir de ce fichier.

source:
  base_url: "https://www.football-data.co.uk/mmz4281"
  request_delay_s: 1.0        # politesse envers le site (une requête par seconde)
  timeout_s: 30

# Saisons au format "AAAA-AAAA". La saison en cours (2026-2027) est volontairement exclue :
# elle servira de test "forward" vraiment hors échantillon une fois le protocole figé.
seasons:
  first: 2005
  last: 2025                  # = saison 2025-2026, dernière saison complète

# Deux niveaux par pays : on veut tester l'hypothèse "moins de liquidité => plus d'inefficience".
leagues:
  E0: { country: eng, tier: 1, name: "Premier League" }
  E1: { country: eng, tier: 2, name: "Championship" }
  SP1: { country: esp, tier: 1, name: "La Liga" }
  SP2: { country: esp, tier: 2, name: "Segunda Division" }
  I1: { country: ita, tier: 1, name: "Serie A" }
  I2: { country: ita, tier: 2, name: "Serie B" }
  D1: { country: ger, tier: 1, name: "Bundesliga" }
  D2: { country: ger, tier: 2, name: "2. Bundesliga" }
  F1: { country: fra, tier: 1, name: "Ligue 1" }
  F2: { country: fra, tier: 2, name: "Ligue 2" }
  N1: { country: ned, tier: 1, name: "Eredivisie" }
  P1: { country: por, tier: 1, name: "Primeira Liga" }

paths:
  raw: data/raw/foot
  processed: data/processed/foot
  reports: reports
  team_aliases: configs/team_aliases_foot.yaml

quality:
  overround_min: 1.00         # en dessous : arbitrage apparent, donc erreur de données
  overround_max: 1.20         # au-dessus : cote périmée ou faute de saisie probable
  overround_min_best_price: 0.90  # market_max (meilleure cote multi-books) : < 1 possible et réel

# ---------------------------------------------------------------------------------------------
# Protocole d'évaluation (étape b). FIGÉ le 2026-10-25, avant toute modélisation.
# Toute modification ultérieure doit être justifiée dans docs/protocol.md (section "Amendements").
# ---------------------------------------------------------------------------------------------
evaluation:
  burn_in_last: 2011-2012       # 2005-2012 : les modèles apprennent, aucune prédiction notée
  eval_first: 2012-2013         # début de Pinnacle : première saison notée
  tuning_last: 2016-2017        # 2012-2017 : réglage des hyperparamètres (validation)
  test_first: 2017-2018         # 2017-2025 : test, regardé UNE fois par modèle final
  test_last: 2024-2025
  holdout: 2025-2026            # Pinnacle partiel : test secondaire, référence de repli
  outcomes: [H, D, A]
  reference: { bookmaker: pinnacle, timing: closing, margin_method: shin }
  fallback_reference: { bookmaker: market_avg, timing: closing, margin_method: shin }
  primary_metric: log_loss
  secondary_metrics: [rps, brier]
  time_block: week              # unité de walk-forward et de bootstrap
  bootstrap: { n_boot: 2000, seed: 20261025, alpha: 0.05 }

# ---------------------------------------------------------------------------------------------
# Modèles (étape c et suivantes). `params` = réglage retenu, `grid` = espace exploré en tuning.
# `params` ne doit être modifié qu'à partir de reports/tuning_<modele>.csv (période de réglage).
# ---------------------------------------------------------------------------------------------
models:
  elo:
    params:
      k: 20
      home_advantage: 60
      season_regression: 0.2
      new_team_offset: 100
      use_margin: true
      calib_seasons: 6
    # Grille 3 (dernière). Grille 1 : K=30 au bord. Grille 2 : K=20, new_team_offset=0 et
    # calib_seasons=10 tous au bord. Une équipe "jamais vue" est surtout un promu de 3e division
    # entrant en D2 : souvent fort, d'où un décalage possiblement NÉGATIF. On l'explore.
    grid:
      k: [10, 15, 20, 25]
      home_advantage: [70]
      season_regression: [0.0, 0.1]
      new_team_offset: [-100, -50, 0, 50]
      calib_seasons: [10, 15, 99]
      use_margin: [true]
