[project]
name = "mvm"
version = "0.1.0"
description = "Model vs Market: probabilistic sports models benchmarked against bookmaker odds"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Najib Nasr" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
model = ["scipy>=1.12", "scikit-learn>=1.4"]
app = ["streamlit>=1.35", "plotly>=5.20"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
